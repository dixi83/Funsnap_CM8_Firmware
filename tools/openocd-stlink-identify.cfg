# Reconstructed from successful CM8 research commands.
# Confirm board identity and electrical connections before attaching.
source [find interface/stlink.cfg]
transport select swd
adapter speed 100

swd newdap cm8 cpu
dap create cm8.dap -chain-position cm8.cpu
target create cm8.cpu cortex_m -dap cm8.dap

gdb port disabled
tcl port disabled
telnet port disabled
init

foreach addr {0xe000ed00 0x40022020 0x1fff3100} {
    if {[catch {read_memory $addr 32 1} value]} {
        echo [format "0x%08x read failed" $addr]
    } else {
        echo [format "0x%08x = 0x%08x" $addr [lindex $value 0]]
    }
}

shutdown
